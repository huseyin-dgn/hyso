[metadata]
name = hyso
version = 0.2.0
author = Huseyin Dogan
description = Hyso: Custom CNN models, SE/CBAM blocks, callbacks, and augmentations
long_description = HYSo Python library.
long_description_content_type = text/markdown
url = https://github.com/huseyin-dgn/hyso
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = False
python_requires = >=3.10
install_requires =
    torch>=2.2.2
    torchvision>=0.17.2
    numpy
    matplotlib
    seaborn
    scikit-learn
    tqdm
    torchsummary

[options.packages.find]
where = .
include =
    hyso
    hyso.*

[options.extras_require]
deployment =
    onnx==1.20.0
    onnxruntime==1.23.2
