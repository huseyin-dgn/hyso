[metadata]
name = hyso
version = 0.1.6
author = Huseyin Dogan
author_email = hdgn5838@gmial.com
description = Hyso: Custom CNN models, SE/CBAM blocks, callbacks, and augmentations
long_description = HYSo Python library.
long_description_content_type = text/markdown
url = https://github.com/huseyin-dgn/hyso
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
include_package_data = False
python_requires = >=3.8
install_requires =
    torch>=2.0
    torchvision>=0.14
    numpy
    matplotlib
    seaborn
    scikit-learn
    tqdm
    torchsummary

[options.packages.find]
where = .
include =
    hyso
    hyso.*
