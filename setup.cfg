[metadata]
name = hyso
version = 0.2.0
author = Huseyin Dogan
description = HYSo: PyTorch model engineering, training, evidence analysis and explicit export
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/huseyin-dgn/hyso
license = MIT
license_files =
    LICENSE
    THIRD_PARTY_NOTICES.md
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Operating System :: Microsoft :: Windows

[options]
packages = find:
py_modules = hyso_guide
include_package_data = False
python_requires = >=3.10,<3.13
install_requires =
    torch>=2.5.1,<2.6
    torchvision>=0.20.1,<0.21
    numpy
    matplotlib
    seaborn
    scikit-learn
    tqdm
    torchsummary

[options.packages.find]
where = .
include =
    hyso
    hyso.*

[options.package_data]
hyso =
    py.typed
    data/user-guide.html
    data/user-guide-topics.json
    data/api-topics.json

[options.entry_points]
console_scripts =
    hyso = hyso.cli:main
    hyso-guide = hyso_guide:main

[options.extras_require]
deployment =
    onnx==1.20.0
    onnxruntime==1.23.2
deployment-cpu =
    onnx==1.20.0
    onnxruntime==1.23.2
deployment-gpu =
    onnx==1.20.0
    onnxruntime-gpu==1.23.2; platform_system == "Windows" or platform_system == "Linux"
tensorrt =
    onnx==1.20.0
    tensorrt-cu12==10.13.3.9; platform_system == "Windows" or platform_system == "Linux"
onnx-dynamo =
    onnx==1.20.0
    onnxscript==0.5.6
precision =
    onnx==1.20.0
    onnxruntime==1.23.2
